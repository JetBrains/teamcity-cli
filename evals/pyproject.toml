[project]
name = "teamcity-cli-evals"
version = "0.1.0"
description = "Skill evals for the TeamCity CLI, run in Harbor"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.0.3",
    "anthropic>=0.87.0",
    "langfuse>=4,<5",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py311"
